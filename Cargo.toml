[package]
name = "yt-dlp-gui"
version = "0.1.0"
edition = "2021"
description = "Портативный GUI-загрузчик на базе yt-dlp с тёмным интерфейсом"
build = "build.rs"

[dependencies]
eframe = { version = "0.27", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.27"
rfd = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
dirs = "5"
sha2 = "0.10"
open = "5"
anyhow = "1"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

# Уменьшаем размер финального exe
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
