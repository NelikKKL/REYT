name: Build yt-dlp GUI

# Запускается вручную, при пуше в main и при push тега вида v1.0.0
# (тег дополнительно публикует бинарники в GitHub Release).
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]

env:
  YTDLP_RELEASE_URL: https://github.com/yt-dlp/yt-dlp/releases/latest/download
  # BtbN/FFmpeg-Builds публикует статические сборки ffmpeg для Windows/Linux
  # под "плавающим" тегом latest — удобно скачивать без ручного поиска версии.
  # LGPL-сборка выбрана специально, чтобы не тащить GPL-лицензию в готовый exe.
  FFMPEG_RELEASE_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: yt-dlp-gui.exe
            asset_name: yt-dlp-gui-windows-x64
          - os: ubuntu-latest
            artifact_name: yt-dlp-gui
            asset_name: yt-dlp-gui-linux-x64
          - os: macos-latest
            artifact_name: yt-dlp-gui
            asset_name: yt-dlp-gui-macos-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo/target
        uses: Swatinem/rust-cache@v2

      # ---------------------------------------------------------------
      # Windows: yt-dlp.exe + ffmpeg.exe
      # ---------------------------------------------------------------
      - name: Download yt-dlp (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "$env:YTDLP_RELEASE_URL/yt-dlp.exe" -OutFile bin/yt-dlp.exe

      - name: Download ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "$env:FFMPEG_RELEASE_URL/ffmpeg-master-latest-win64-lgpl.zip" -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_extracted -Force
          $ffmpegExe = Get-ChildItem -Path ffmpeg_extracted -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          Copy-Item $ffmpegExe.FullName -Destination bin/ffmpeg.exe -Force
          Remove-Item ffmpeg.zip, ffmpeg_extracted -Recurse -Force

      # ---------------------------------------------------------------
      # Linux: yt-dlp + ffmpeg
      # ---------------------------------------------------------------
      - name: Download yt-dlp (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl -fL "$YTDLP_RELEASE_URL/yt-dlp" -o bin/yt-dlp
          chmod +x bin/yt-dlp

      - name: Download ffmpeg (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl -fL "$FFMPEG_RELEASE_URL/ffmpeg-master-latest-linux64-lgpl.tar.xz" -o ffmpeg.tar.xz
          mkdir ffmpeg_extracted
          tar -xf ffmpeg.tar.xz -C ffmpeg_extracted
          FFMPEG_BIN=$(find ffmpeg_extracted -type f -name "ffmpeg" | head -n1)
          cp "$FFMPEG_BIN" bin/ffmpeg
          chmod +x bin/ffmpeg
          rm -rf ffmpeg.tar.xz ffmpeg_extracted

      # ---------------------------------------------------------------
      # macOS: yt-dlp (готовый бинарник) + ffmpeg (через Homebrew,
      # т.к. у BtbN нет macOS-сборок)
      # ---------------------------------------------------------------
      - name: Download yt-dlp (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          curl -fL "$YTDLP_RELEASE_URL/yt-dlp_macos" -o bin/yt-dlp
          chmod +x bin/yt-dlp

      - name: Install ffmpeg via Homebrew (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install ffmpeg
          cp "$(command -v ffmpeg)" bin/ffmpeg
          chmod +x bin/ffmpeg

      # ---------------------------------------------------------------
      - name: Verify binaries were downloaded (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ((Get-Item bin/yt-dlp.exe).Length -eq 0) { throw "yt-dlp.exe пустой" }
          if ((Get-Item bin/ffmpeg.exe).Length -eq 0) { throw "ffmpeg.exe пустой" }

      - name: Verify binaries were downloaded (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          test -s bin/yt-dlp
          test -s bin/ffmpeg

      - name: Build (release)
        run: cargo build --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: target/release/${{ matrix.artifact_name }}
          if-no-files-found: error

  release:
    name: Publish to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create Release and attach binaries
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
